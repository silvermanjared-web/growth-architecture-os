<text x="110" y="735" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#6C655B">THE OPERATING LOOP</text>
<text x="110" y="785" font-family="Georgia, serif" font-size="31" fill="#171717">Brief → Plan → Execute → Test &amp; Learn → Diagnose → Feed Forward</text>
<line x1="110" y1="825" x2="1490" y2="825" stroke="#171717" stroke-width="1"/>
<text x="110" y="875" font-family="Georgia, serif" font-size="25" font-style="italic" fill="#171717">The technology gets more sophisticated. The leadership principle stays simple.</text>
<text x="110" y="925" font-family="Arial, sans-serif" font-size="16" fill="#5D5952">Autonomous members. Explicit contracts. Bounded authority. Evidence after execution. Learning carried forward.</text>
<text x="1490" y="950" text-anchor="end" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6C655B">PUBLIC PORTFOLIO / 2026</text>
