<text x="110" y="220" font-family="Georgia, serif" font-size="72" fill="#111111">Architecture for</text>
<text x="110" y="300" font-family="Georgia, serif" font-size="72" font-style="italic" fill="#111111">compounding decisions.</text>
<text x="110" y="360" font-family="Arial, sans-serif" font-size="23" fill="#4A4741">Enough structure to create trust. Not enough process to slow the work.</text>

